<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:2263px;overflow:hidden}
.c{width:1600px;height:2263px;position:relative;
  background:linear-gradient(165deg,#1a1033 0%,#2e1065 55%,#3b0764 100%);
  font-family:'Arial Black','Apple SD Gothic Neo',sans-serif;
  padding:150px 130px;display:flex;flex-direction:column;color:#fff;overflow:hidden}
.c::before{content:"";position:absolute;top:-300px;right:-300px;width:1100px;height:1100px;
  background:radial-gradient(circle,#ec489955,transparent 62%)}
.c::after{content:"";position:absolute;bottom:-350px;left:-300px;width:1100px;height:1100px;
  background:radial-gradient(circle,#8b5cf655,transparent 62%)}
.tag{position:relative;z-index:2;font-size:46px;font-weight:900;letter-spacing:8px;color:#fbbf24}
.tag .bar{display:inline-block;width:90px;height:12px;background:#fbbf24;border-radius:8px;vertical-align:middle;margin-right:26px}
.title{position:relative;z-index:2;margin-top:90px;font-size:172px;font-weight:900;line-height:1.0;letter-spacing:-5px;text-shadow:0 10px 40px rgba(0,0,0,.5)}
.title .y{color:#fbbf24}.title .p{color:#f9a8d4}
.year{position:relative;z-index:2;margin-top:30px;font-size:120px;font-weight:900;color:#a78bfa;letter-spacing:6px}
.subtitle{position:relative;z-index:2;margin-top:60px;font-size:58px;font-weight:800;line-height:1.35;color:#e9d5ff;font-family:'Apple SD Gothic Neo','Arial Black',sans-serif}
.pills{position:relative;z-index:2;margin-top:auto;display:flex;gap:28px;flex-wrap:wrap}
.pill{font-size:46px;font-weight:900;padding:26px 46px;border-radius:999px;
  background:#ffffff1a;border:4px solid #ffffff44;color:#fff;
  font-family:'Apple SD Gothic Neo','Arial Black',sans-serif}
.foot{position:relative;z-index:2;margin-top:80px;display:flex;justify-content:space-between;align-items:center}
.foot .brand{font-size:50px;font-weight:900;letter-spacing:3px;color:#fff}
.foot .by{font-size:38px;color:#c4b5fd;font-weight:700}
.emoji{position:absolute;top:150px;right:130px;z-index:2;font-size:150px;font-family:'Apple Color Emoji'}
</style></head><body>
<div class="c">
  <div class="tag"><span class="bar"></span>INSIDER SHOPPING GUIDE</div>
  <div class="emoji">🇰🇷</div>
  <div class="title">Seoul<br><span class="y">K-Fashion</span><br><span class="p">Shopping</span><br>Guide</div>
  <div class="year">2026</div>
  <div class="subtitle">Where to shop · what it costs ·<br>how to save with tax refunds</div>
  <div class="pills">
    <div class="pill">🗺️ 4 Area Maps</div>
    <div class="pill">🏬 50 Stores</div>
    <div class="pill">💸 Tax Refund</div>
    <div class="pill">💰 Budget Routes</div>
  </div>
  <div class="foot"><div class="brand">SHOP IN SEOUL</div><div class="by">by GOYU STUDIO</div></div>
</div></body></html>
