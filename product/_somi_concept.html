<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:800px;overflow:hidden}
.c{width:1200px;height:800px;position:relative;
  background:linear-gradient(150deg,#fff4ec 0%,#ffe3d3 55%,#ffd0bd 100%);
  font-family:'Apple SD Gothic Neo','Hiragino Sans','Arial Black',sans-serif;
  padding:64px 70px;display:flex;flex-direction:column;color:#5a2d22;overflow:hidden}
.c::before{content:"";position:absolute;top:-160px;right:-120px;width:560px;height:560px;
  background:radial-gradient(circle,#ff9e7d55,transparent 62%)}
.tag{position:relative;z-index:2;font-size:22px;font-weight:900;letter-spacing:4px;color:#e8603c}
.tag .bar{display:inline-block;width:54px;height:8px;background:#e8603c;border-radius:6px;vertical-align:middle;margin-right:18px}
.name{position:relative;z-index:2;margin-top:26px;font-size:88px;font-weight:900;line-height:1.0;letter-spacing:-2px;color:#3f1f17}
.name .en{display:block;font-size:34px;color:#e8603c;letter-spacing:3px;margin-top:10px}
.hello{position:relative;z-index:2;margin-top:22px;font-size:30px;font-weight:800;color:#c84a2a}
.persona{position:relative;z-index:2;margin-top:18px;font-size:25px;font-weight:700;line-height:1.5;color:#5a2d22;max-width:18ch}
.mascot{position:absolute;right:70px;top:170px;z-index:2;width:330px;height:430px;
  background:#fff;border:8px solid #fff;border-radius:30px;box-shadow:0 20px 50px rgba(200,74,42,.25);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transform:rotate(3deg)}
.mascot .face{font-size:150px;line-height:1}
.mascot .bag{font-size:84px}
.mascot .cap{font-size:20px;font-weight:900;color:#e8603c;letter-spacing:2px}
.devices{position:relative;z-index:2;margin-top:auto;display:flex;gap:14px;flex-wrap:wrap}
.dev{font-size:19px;font-weight:900;padding:13px 22px;border-radius:999px;background:#ffffffcc;border:3px solid #ffb59a;color:#c84a2a}
.brand{position:absolute;bottom:40px;right:70px;z-index:2;font-size:22px;font-weight:900;color:#b8593c;letter-spacing:1px}
</style></head><body>
<div class="c">
  <div class="tag"><span class="bar"></span>BUYMA SHOP PERSONA · CONCEPT</div>
  <div class="name">ソミのソウル便<span class="en">SOMI's SEOUL PICK</span></div>
  <div class="hello">"안녕! 今日のピックです〜" 🇰🇷</div>
  <div class="persona">ソウル在住の "ソミ" が現地で選び、検品して届ける。</div>
  <div class="mascot">
    <div class="face">🙋‍♀️</div>
    <div class="bag">🛍️</div>
    <div class="cap">SOMI</div>
  </div>
  <div class="devices">
    <div class="dev">🎨 4컷 미니웹툰 포스트</div>
    <div class="dev">💌 동봉 캐릭터 카드</div>
    <div class="dev">🗣️ 시그니처 "안녕!" 인사</div>
    <div class="dev">🧾 현지 검품·정품</div>
  </div>
  <div class="brand">by GOYU STUDIO</div>
</div></body></html>
