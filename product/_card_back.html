<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1300px;height:800px;overflow:hidden}
.card{width:1300px;height:800px;position:relative;
  background:linear-gradient(150deg,#fff7ef 0%,#f6e7d6 100%);
  font-family:'Hiragino Maru Gothic ProN','Apple SD Gothic Neo','Hiragino Sans',sans-serif;
  padding:64px 80px;display:flex;flex-direction:column;color:#5a3220;overflow:hidden}
.title{font-size:40px;font-weight:900;color:#c2683f;letter-spacing:1px}
.msg{margin-top:26px;font-size:30px;font-weight:700;line-height:1.7;color:#5a3220}
.badges{margin-top:auto;display:flex;gap:16px;flex-wrap:wrap}
.b{font-size:24px;font-weight:900;padding:12px 24px;border-radius:999px;background:#fff;border:3px solid #e9b48f;color:#b85c38}
.sign{position:absolute;bottom:60px;right:80px;font-size:30px;font-weight:900;color:#a8472a}
.hand{margin-top:24px;border-top:2px dashed #d9b48f;padding-top:16px;font-size:22px;color:#9a7250;font-weight:700}
.chars{position:absolute;top:50px;right:70px;display:flex;gap:6px}
.chars img{width:120px;height:150px;object-fit:contain;filter:drop-shadow(0 8px 12px rgba(150,90,50,.2))}
</style></head><body>
<div class="card">
  <div class="chars"><img src="characters/kkuldal.png"><img src="characters/ttoyong.png"></div>
  <div class="title">ご購入ありがとうございます♡</div>
  <div class="msg">
    韓国・ソウルから、ひとつひとつ検品してお届けしました。<br>
    気に入っていただけたら、とても嬉しいです！<br>
    サイズ・不良など気になる点は、いつでもお気軽に<br>メッセージくださいね。<br>
    またお会いできるのを楽しみにしています。
  </div>
  <div class="hand">✍️ ___________________________________（手書きメッセージ欄）</div>
  <div class="badges">
    <div class="b">✅ 現地検品済</div>
    <div class="b">🇰🇷 ソウル直送</div>
    <div class="b">💬 フォロー&リピート歓迎</div>
  </div>
  <div class="sign">― 안녕! また会えますように 🇰🇷</div>
</div></body></html>
