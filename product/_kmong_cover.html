<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:652px;height:488px;overflow:hidden}
.c{width:652px;height:488px;position:relative;
  background:linear-gradient(150deg,#1a1033,#2e1065 60%,#3b0764);
  font-family:'Apple SD Gothic Neo','Arial Black',sans-serif;
  padding:46px 48px;display:flex;flex-direction:column;color:#fff;overflow:hidden}
.c::before{content:"";position:absolute;top:-120px;right:-120px;width:420px;height:420px;
  background:radial-gradient(circle,#ec489955,transparent 62%)}
.c::after{content:"";position:absolute;bottom:-140px;left:-120px;width:420px;height:420px;
  background:radial-gradient(circle,#8b5cf655,transparent 62%)}
.tag{position:relative;z-index:2;font-size:18px;font-weight:900;letter-spacing:3px;color:#fbbf24}
.title{position:relative;z-index:2;margin-top:14px;font-size:54px;font-weight:900;line-height:1.05;letter-spacing:-1.5px}
.title .y{color:#fbbf24}.title .p{color:#f9a8d4}
.sub{position:relative;z-index:2;margin-top:16px;font-size:24px;font-weight:800;color:#e9d5ff;line-height:1.35}
.pills{position:relative;z-index:2;margin-top:auto;display:flex;gap:10px;flex-wrap:wrap}
.pill{font-size:17px;font-weight:900;padding:8px 16px;border-radius:999px;background:#ffffff1a;border:2px solid #ffffff44}
.brand{position:absolute;bottom:24px;right:48px;z-index:2;font-size:18px;font-weight:900;color:#c4b5fd;letter-spacing:1px}
.flag{position:absolute;top:40px;right:48px;z-index:2;font-size:54px;font-family:'Apple Color Emoji'}
</style></head><body>
<div class="c">
  <div class="tag">서울 패션 쇼핑 인사이더 가이드</div>
  <div class="flag">🇰🇷</div>
  <div class="title">Seoul <span class="y">K-Fashion</span><br><span class="p">Shopping</span> Guide</div>
  <div class="sub">어디서 · 얼마에 · 택스리펀까지<br>외국인 친구에게 주는 진짜 쇼핑 지도</div>
  <div class="pills"><div class="pill">🗺️ 지역맵 4</div><div class="pill">🏬 매장 50</div><div class="pill">💸 택스리펀</div></div>
  <div class="brand">GOYU STUDIO</div>
</div></body></html>
