<!DOCTYPE html>
<html lang="ko">
<head>

<style>
  :root { --bg:#0f0a1e; --card:#1a1430; --border:#332a52; --text:#f5f3ff; --dim:#b8b0d4; --purple:#a78bfa; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; padding:48px 6vw 80px; }

  .sub { color:var(--dim); margin:10px 0 36px; font-size:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:22px; }
  figure { background:var(--card); border:1px solid var(--border); border-radius:16px; overflow:hidden; }
  figure img { width:100%; display:block; }
  figcaption { padding:12px 14px; font-size:13.5px; color:var(--dim); }
  figcaption b { color:var(--purple); display:block; font-size:14.5px; margin-bottom:2px; }
  a.dl { color:var(--purple); text-decoration:none; font-weight:700; }
  .back { display:inline-block; margin-bottom:24px; color:var(--purple); text-decoration:none; font-weight:700; }
</style>
</head>
